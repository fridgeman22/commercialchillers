<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DCR LTD - Engineer Worksheet</title>
  <style>
    :root {
      --primary: #1d6fa4;
      --text: #1e293b;
      --border: #cbd5e1;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      line-height: 1.5;
      margin: 0;
      padding: 40px;
      background: #f8fafc;
    }
    .page {
      max-width: 800px;
      margin: 0 auto;
      background: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 2px solid var(--primary);
      padding-bottom: 20px;
      margin-bottom: 30px;
    }
    .logo-area h1 {
      margin: 0;
      color: var(--primary);
      font-size: 32px;
      letter-spacing: -1px;
    }
    .logo-area p {
      margin: 0;
      color: #64748b;
      font-weight: 600;
      font-size: 14px;
    }
    .company-details {
      text-align: right;
      font-size: 13px;
      color: #475569;
    }
    .title {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .field {
      margin-bottom: 15px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: inherit;
      font-size: 14px;
      box-sizing: border-box;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    .section-title {
      font-size: 16px;
      font-weight: bold;
      color: var(--primary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 5px;
      margin: 25px 0 15px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid var(--border);
      padding: 8px;
      text-align: left;
      font-size: 14px;
    }
    th {
      background: #f1f5f9;
      font-size: 12px;
      text-transform: uppercase;
      color: #64748b;
    }
    .btn-row {
      text-align: right;
      margin-top: 30px;
    }
    .print-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .print-btn:hover {
      background: #155883;
    }
    
    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .page {
        box-shadow: none;
        padding: 0;
        margin: 0;
        max-width: 100%;
      }
      .print-btn {
        display: none;
      }
      input[type="text"], input[type="date"], textarea {
        border: none;
        border-bottom: 1px dotted #94a3b8;
        padding: 4px 0;
        border-radius: 0;
        background: transparent;
      }
      textarea {
        border: 1px solid #e2e8f0;
      }
    }
  
    .clear-btn {
      background: #e2e8f0; border: none; border-radius: 4px; font-size: 11px; padding: 4px 8px; cursor: pointer; color: #475569; font-weight: bold;
    }
    .clear-btn:hover { background: #cbd5e1; }
    @media print {
      .clear-btn { display: none; }
      canvas { border: none !important; border-bottom: 1px dotted #94a3b8 !important; }
    }

  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="logo-area">
        <h1>DCR LTD</h1>
        <p>Commercial Chillers & Refrigerated Display Cabinets</p>
      </div>
      <div class="company-details">
        Email: fridgeman22@googlemail.com<br>
        Web: www.commercialchillers.co.uk<br>
        Nationwide Delivery, Install & Repairs
      </div>
    </div>

    <div class="title">Engineer's Worksheet</div>

    <div class="grid-2">
      <div class="field">
        <label>Job Reference No.</label>
        <input type="text" placeholder="e.g. DCR-1045">
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date">
      </div>
    </div>

    <div class="grid-2">
      <div class="field">
        <label>Customer Name / Company</label>
        <input type="text">
      </div>
      <div class="field">
        <label>Engineer Name</label>
        <input type="text" value="Chris">
      </div>
    </div>

    <div class="field">
      <label>Site Address</label>
      <textarea style="min-height: 60px;"></textarea>
    </div>

    <div class="section-title">Equipment Details</div>
    <div class="grid-2">
      <div class="field">
        <label>Make & Model</label>
        <input type="text">
      </div>
      <div class="field">
        <label>Serial Number</label>
        <input type="text">
      </div>
      <div class="field">
        <label>Refrigerant Type</label>
        <input type="text">
      </div>
      <div class="field">
        <label>Charge / Quantity</label>
        <input type="text">
      </div>
    </div>

    <div class="section-title">Job Details</div>
    <div class="field">
      <label>Fault Reported</label>
      <textarea></textarea>
    </div>
    <div class="field">
      <label>Work Carried Out</label>
      <textarea style="min-height: 120px;"></textarea>
    </div>

    <div class="section-title">Parts Used</div>
    <table>
      <thead>
        <tr>
          <th style="width: 15%;">Qty</th>
          <th>Description</th>
          <th style="width: 25%;">Part No.</th>
        </tr>
      </thead>
      <tbody>
        <tr><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td></tr>
        <tr><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td></tr>
        <tr><td><input type="text"></td><td><input type="text"></td><td><input type="text"></td></tr>
      </tbody>
    </table>

    <div class="grid-2">
      <div class="field">
        <label>Labour (Hours / Travel)</label>
        <input type="text">
      </div>
      <div class="field">
        <label>Further Action Required?</label>
        <input type="text" placeholder="Yes / No (If yes, details)">
      </div>
    </div>

    
    <div class="section-title">Signatures</div>
    <div class="grid-2" style="margin-top: 20px;">
      <div class="field">
        <label>Engineer Signature</label>
        <div style="border: 1px solid #cbd5e1; border-radius: 4px; background: #f8fafc; position: relative;">
          <canvas id="eng-sig" width="350" height="100" style="width: 100%; display: block; cursor: crosshair; touch-action: none;"></canvas>
          <button type="button" class="clear-btn" onclick="clearCanvas('eng-sig')" style="position: absolute; top: 5px; right: 5px;">Clear</button>
        </div>
      </div>
      <div class="field">
        <label>Customer Signature</label>
        <div style="border: 1px solid #cbd5e1; border-radius: 4px; background: #f8fafc; position: relative;">
          <canvas id="cust-sig" width="350" height="100" style="width: 100%; display: block; cursor: crosshair; touch-action: none;"></canvas>
          <button type="button" class="clear-btn" onclick="clearCanvas('cust-sig')" style="position: absolute; top: 5px; right: 5px;">Clear</button>
        </div>
      </div>
    </div>

    <div class="btn-row">
      <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>

  <script>
    function setupCanvas(id) {
      const canvas = document.getElementById(id);
      const ctx = canvas.getContext('2d');
      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;

      // Make lines smooth and dark blue
      ctx.strokeStyle = '#1d6fa4';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        // Handle both touch and mouse
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        // Scale for canvas internal resolution vs CSS size
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
          x: (clientX - rect.left) * scaleX,
          y: (clientY - rect.top) * scaleY
        };
      }

      function startDrawing(e) {
        if(e.type === 'touchstart') e.preventDefault();
        isDrawing = true;
        const pos = getPos(e);
        lastX = pos.x;
        lastY = pos.y;
      }

      function draw(e) {
        if (!isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        lastX = pos.x;
        lastY = pos.y;
      }

      function stopDrawing() {
        isDrawing = false;
      }

      canvas.addEventListener('mousedown', startDrawing);
      canvas.addEventListener('mousemove', draw);
      canvas.addEventListener('mouseup', stopDrawing);
      canvas.addEventListener('mouseout', stopDrawing);
      
      canvas.addEventListener('touchstart', startDrawing, {passive: false});
      canvas.addEventListener('touchmove', draw, {passive: false});
      canvas.addEventListener('touchend', stopDrawing);
    }

    function clearCanvas(id) {
      const canvas = document.getElementById(id);
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    window.addEventListener('load', () => {
      setupCanvas('eng-sig');
      setupCanvas('cust-sig');
    });
  </script>
</body>

</html>
